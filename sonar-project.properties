# Análise do SonarQube Cloud. Organização e projectKey são passados pela CI
# (variável SONAR_ORGANIZATION); aqui ficam só as regras deste repositório.
sonar.projectName=evaluation-service
sonar.sources=.
sonar.exclusions=**/*_test.go
sonar.tests=.
sonar.test.inclusions=**/*_test.go
sonar.go.coverage.reportPaths=coverage.out
# main.go só faz a ligação das peças (lê o ambiente, conecta no banco/Redis/SQS
# e sobe o servidor HTTP). Continua analisado para bugs e vulnerabilidades,
# mas fica fora da métrica de cobertura: é exercitado no deploy e nos testes
# de ponta a ponta no cluster, não em teste unitário.
sonar.coverage.exclusions=main.go
