# Entidade deste repositório no Backstage (toggle-master-backstage).
# As anotações ligam as abas do portal: pipelines (GitHub Actions), pods
# (Kubernetes, nos clusters no ar), deploy por ambiente (Argo CD) e docs
# (TechDocs, a partir do mkdocs.yml).
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: evaluation-service
  description: Caminho quente: avalia uma flag para um usuário, com cache em Redis, e publica o evento no SQS.
  tags:
    - go
  annotations:
    github.com/project-slug: FIAP-PosTech-DevOps/evaluation-service
    backstage.io/techdocs-ref: dir:.
    backstage.io/kubernetes-namespace: evaluation-service
    backstage.io/kubernetes-label-selector: app=evaluation-service
    argocd/app-name: evaluation-service
  links:
    - url: https://github.com/FIAP-PosTech-DevOps/toggle-master-gitops/tree/main/apps/evaluation-service
      title: Manifestos (GitOps)
      icon: github
spec:
  type: service
  lifecycle: production
  owner: group:grupo-fase3
  system: togglemaster
  dependsOn:
    - component:default/flag-service
    - component:default/targeting-service
    - resource:default/redis-cache
    - resource:default/evaluation-events
