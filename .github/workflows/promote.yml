# Produção do evaluation-service: o merge de um PR release/vX.Y.Z -> main leva a
# versão para production, com aprovação no Environment "production".
# Sem novo build: promove a mesma imagem vX.Y.Z-<sha> que está em staging.
# A lógica fica em toggle-master-infra/.github/workflows/service-promote.yml.
name: promote

on:
  pull_request:
    types: [closed]
    branches: [main]

# Nada por padrão; cada job pede só o que usa.
permissions: {}

jobs:
  production:
    # Só PR mergeado (fechar sem merge não promove) e vindo de uma release.
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/v')
    uses: FIAP-PosTech-DevOps/toggle-master-infra/.github/workflows/service-promote.yml@main
    permissions:
      contents: write # tag vX.Y.Z na main
      id-token: write # OIDC com a AWS para conferir a imagem no ECR
    with:
      service-name: evaluation-service
      aws-account-id: ${{ vars.AWS_ACCOUNT_ID }}
    secrets: inherit
