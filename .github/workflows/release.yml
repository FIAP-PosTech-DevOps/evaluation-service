# Botão de release (aba Actions > release > Run workflow):
#   criar-release   release/vX.Y.Z a partir da main
# O resto do fluxo é por PR: feature -> release (staging) -> main (production).
# A lógica fica em toggle-master-infra/.github/workflows/git-release.yml.
name: release

on:
  workflow_dispatch:
    inputs:
      tipo-de-versao:
        description: "patch (correção), minor (funcionalidade), major (quebra de contrato)"
        type: choice
        options: [patch, minor, major]
        default: patch

# Nada por padrão; cada job pede só o que usa.
permissions: {}

jobs:
  release:
    uses: FIAP-PosTech-DevOps/toggle-master-infra/.github/workflows/git-release.yml@main
    permissions:
      contents: read
    with:
      action: criar-release
      bump: ${{ inputs.tipo-de-versao }}
    secrets: inherit
